name: Build Xiaomi 15 Duo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q Xiaomi15-DuoWallpaper-v4.zip -d build-src

      - name: Verify project
        run: |
          echo "=== Extracted files ==="
          find build-src -maxdepth 3 -type f | sort | head -100
          echo "=== Gradle root ==="
          grep -n "rootProject.name" build-src/Xiaomi15-DuoWallpaper-v4/settings.gradle.kts || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: build-src/Xiaomi15-DuoWallpaper-v4
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi15-DuoWallpaper-v4-debug
          path: build-src/Xiaomi15-DuoWallpaper-v4/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
